<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Define tu identidad — Road to Immortal</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* Fallback si se abre el HTML suelto, sin la carpeta del proyecto */
    :root {
      --bg: #080a0f; --text: #f0f4f9; --text-2: #b3c1d1; --text-3: #8494a7;
      --ember: #ff6b3d; --ember-2: #cc4a22; --gold: #ffc247; --line: #2a3646;
      --radius-s: 7px;
      --sans: "Segoe UI", Inter, system-ui, sans-serif;
    }
  </style>
</head>
<body>
<div class="create-forge">
  <input type="hidden" id="f-region" value="eeu">
  <input type="hidden" id="f-nat" value="Rusia">

  <div class="create-shell">
    <header class="create-head">
      <div class="kicker">Road to Immortal</div>
      <h2>Define tu identidad</h2>
    </header>

    <div class="create-grid">

      <section class="create-col identity">
        <h3>Identidad</h3>
        <div class="id-block">
          <article class="pcard pcard-mid">
            <div class="pcard-glow" aria-hidden="true"></div>
            <span class="pcard-pos" aria-hidden="true">POS 2</span>
            <div class="pcard-flag" title="Rusia">
              <img class="flag-lg" alt="" width="80" height="56" src="https://flagcdn.com/w80/ru.png">
            </div>
            <span class="pcard-nick" title="NICK">NICK</span>
            <div class="pcard-name" title="sin nombre">sin nombre</div>
            <div class="pcard-tags">
              <span>16 años</span>
              <span>MID</span>
              <span>Mecánico</span>
            </div>
            <div class="pcard-region">Europa del Este</div>
          </article>
          <div class="id-fields">
            <label class="id-field nick-field">
              <span>Nick</span>
              <input id="f-nick" type="text" maxlength="16" value="" placeholder="lester" autocomplete="off">
            </label>
            <label class="id-field">
              <span>Nombre</span>
              <input id="f-name" type="text" maxlength="28" value="" placeholder="Nombre real" autocomplete="off">
            </label>
          </div>
        </div>
        <h3 class="mt-block">Circuito</h3>
        <div class="reg-row">
          <button type="button" class="reg-chip sel" data-action="pick-region" data-value="eeu"><b>EEU</b><span>Europa del Este</span></button>
          <button type="button" class="reg-chip" data-action="pick-region" data-value="weu"><b>WEU</b><span>Europa Occidental</span></button>
          <button type="button" class="reg-chip" data-action="pick-region" data-value="cn"><b>CN</b><span>China</span></button>
          <button type="button" class="reg-chip" data-action="pick-region" data-value="sea"><b>SEA</b><span>Sudeste Asiático</span></button>
          <button type="button" class="reg-chip" data-action="pick-region" data-value="na"><b>NA</b><span>Norteamérica</span></button>
          <button type="button" class="reg-chip" data-action="pick-region" data-value="sa"><b>SA</b><span>Sudamérica</span></button>
        </div>
      </section>

      <section class="create-col origin">
        <h3>Nacionalidad</h3>
        <input id="f-nat-search" type="search" placeholder="Buscar país" autocomplete="off">
        <div class="nat-grid">
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Alemania" data-name="Alemania"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/de.png"></span><span>Alemania</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Brasil" data-name="Brasil"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/br.png"></span><span>Brasil</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="China" data-name="China"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/cn.png"></span><span>China</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="España" data-name="España"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/es.png"></span><span>España</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Estados Unidos" data-name="Estados Unidos"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/us.png"></span><span>Estados Unidos</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Filipinas" data-name="Filipinas"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/ph.png"></span><span>Filipinas</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Francia" data-name="Francia"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/fr.png"></span><span>Francia</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Perú" data-name="Perú"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/pe.png"></span><span>Perú</span></button>
          <button type="button" class="nat-item sel" data-action="pick-nat" data-value="Rusia" data-name="Rusia"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/ru.png"></span><span>Rusia</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Suecia" data-name="Suecia"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/se.png"></span><span>Suecia</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Ucrania" data-name="Ucrania"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/ua.png"></span><span>Ucrania</span></button>
          <button type="button" class="nat-item" data-action="pick-nat" data-value="Venezuela" data-name="Venezuela"><span class="nat-flag"><img class="flag-sm" alt="" width="22" height="15" src="https://flagcdn.com/w40/ve.png"></span><span>Venezuela</span></button>
        </div>
        <p class="nat-empty" hidden>No se encontraron países</p>
      </section>

      <section class="create-col play">
        <h3>Posición</h3>
        <div class="role-list">
          <button type="button" class="role-row" data-action="pick-role" data-value="carry"><b>POS 1 — CARRY</b><i>Farm · Escalado · Daño</i></button>
          <button type="button" class="role-row sel" data-action="pick-role" data-value="mid"><b>POS 2 — MID</b><i>Mecánicas · Tempo · Dominio</i></button>
          <button type="button" class="role-row" data-action="pick-role" data-value="offlane"><b>POS 3 — OFFLANE</b><i>Iniciación · Espacio · Teamfight</i></button>
          <button type="button" class="role-row" data-action="pick-role" data-value="pos4"><b>POS 4 — SOFT SUPPORT</b><i>Rotaciones · Playmaking · Control</i></button>
          <button type="button" class="role-row" data-action="pick-role" data-value="pos5"><b>POS 5 — HARD SUPPORT</b><i>Visión · Teamplay · Liderazgo</i></button>
        </div>
      </section>

      <section class="create-col style">
        <h3>Estilo</h3>
        <div class="arch-row">
          <button type="button" class="arch-chip sel" data-action="pick-arch" data-value="mechanical">
            <b>Mecánico</b>
            <span class="arch-pro">+ Mecánicas y hero pool superiores</span>
            <span class="arch-con">− Teamplay y liderazgo más lentos</span>
          </button>
          <button type="button" class="arch-chip" data-action="pick-arch" data-value="smart">
            <b>Inteligente</b>
            <span class="arch-pro">+ Game sense y adaptación superiores</span>
            <span class="arch-con">− Menor explosividad mecánica</span>
          </button>
          <button type="button" class="arch-chip" data-action="pick-arch" data-value="aggressive">
            <b>Agresivo</b>
            <span class="arch-pro">+ Actuaciones extraordinarias más frecuentes</span>
            <span class="arch-con">− Mucha más volatilidad</span>
          </button>
          <button type="button" class="arch-chip" data-action="pick-arch" data-value="consistent">
            <b>Consistente</b>
            <span class="arch-pro">+ Muy pocas malas rachas</span>
            <span class="arch-con">− Pocas actuaciones memorables</span>
          </button>
          <button type="button" class="arch-chip" data-action="pick-arch" data-value="leader">
            <b>Líder</b>
            <span class="arch-pro">+ Liderazgo, mentalidad y sinergia superiores</span>
            <span class="arch-con">− Desarrollo mecánico más lento</span>
          </button>
        </div>
      </section>
    </div>

    <div class="create-foot">
      <button class="btn btn-ghost" data-action="go-home">Volver</button>
      <button class="btn btn-primary btn-lg" data-action="create-confirm">Confirmar identidad</button>
    </div>
  </div>
</div>
</body>
</html>
